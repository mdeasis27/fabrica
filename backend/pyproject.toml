[project]
name = "fabrica"
version = "0.1.0"
description = "Auto-generated eval sets from production logs — dedupe, intent clustering and sampling"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
